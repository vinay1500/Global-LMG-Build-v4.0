# Admin panel SPA for Global LMG.
# Replace admin.globallmg.example with the real admin domain.

server {
    listen 80;
    server_name admin.globallmg.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.globallmg.example;

    ssl_certificate /etc/letsencrypt/live/admin.globallmg.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.globallmg.example/privkey.pem;

    root /srv/global-lmg/current/admin_frontend/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
