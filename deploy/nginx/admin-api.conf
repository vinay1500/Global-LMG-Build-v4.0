# Admin API reverse proxy.
# Replace admin-api.globallmg.example with the real admin API domain.

upstream global_lmg_admin_api {
    server 127.0.0.1:3005;
    keepalive 32;
}

server {
    listen 80;
    server_name admin-api.globallmg.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin-api.globallmg.example;

    ssl_certificate /etc/letsencrypt/live/admin-api.globallmg.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-api.globallmg.example/privkey.pem;

    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/v1/admin/ {
        proxy_pass http://global_lmg_admin_api/api/v1/admin/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }

    location /api/v1/webhooks/ {
        proxy_pass http://global_lmg_admin_api/api/v1/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
